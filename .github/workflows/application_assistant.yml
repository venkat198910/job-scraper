name: Application Assistant

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Application assistant mode"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - queue
          - plan-all-portals
          - prepare-easy-apply
          - prepare-workday-profile
          - prepare-company-portal
          - auto-apply
      min_score:
        description: "Minimum score for application candidates"
        required: true
        default: "80"
      limit:
        description: "Maximum candidates to inspect"
        required: true
        default: "10"
      max_job_age_minutes:
        description: "Only process jobs posted/scraped within this many minutes. 0 disables freshness filter."
        required: true
        default: "120"
      daily_submit_limit:
        description: "Maximum applications to submit per UTC day. 0 disables the cap."
        required: true
        default: "30"
      provider:
        description: "Provider scope"
        required: true
        default: "linkedin"
        type: choice
        options:
          - linkedin
          - all
      headless:
        description: "Run browser headless"
        required: true
        default: false
        type: boolean
      allow_login:
        description: "Allow filling company portal login using configured secrets"
        required: true
        default: false
        type: boolean
      allow_register:
        description: "Allow creating first-time company portal accounts"
        required: true
        default: false
        type: boolean
      allow_submit:
        description: "Allow final submit when no unknown required fields are detected"
        required: true
        default: false
        type: boolean

jobs:
  application_assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run application assistant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINKEDIN_STORAGE_STATE_JSON: ${{ secrets.LINKEDIN_STORAGE_STATE_JSON }}
          APPLICATION_PORTAL_EMAIL: ${{ secrets.APPLICATION_PORTAL_EMAIL }}
          APPLICATION_PORTAL_PASSWORD: ${{ secrets.APPLICATION_PORTAL_PASSWORD }}
          APPLICATION_DEFAULT_ANSWERS_JSON: ${{ secrets.APPLICATION_DEFAULT_ANSWERS_JSON }}
        run: |
          PROVIDER="${{ inputs.provider }}"
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "plan-all-portals" ]; then
            MODE="plan"
            PROVIDER="all"
          fi
          ARGS=(
            --mode "$MODE"
            --provider "$PROVIDER"
            --min-score "${{ inputs.min_score }}"
            --limit "${{ inputs.limit }}"
            --max-job-age-minutes "${{ inputs.max_job_age_minutes }}"
            --daily-submit-limit "${{ inputs.daily_submit_limit }}"
          )
          if [ "${{ inputs.headless }}" = "true" ]; then
            ARGS+=(--headless)
          fi
          if [ "${{ inputs.allow_login }}" = "true" ]; then
            ARGS+=(--allow-login)
          fi
          if [ "${{ inputs.allow_register }}" = "true" ]; then
            ARGS+=(--allow-register)
          fi
          if [ "${{ inputs.allow_submit }}" = "true" ]; then
            ARGS+=(--allow-submit)
          fi
          python application_assistant.py "${ARGS[@]}"

name: Hourly Job Pipeline

on:
  schedule:
  # GitHub cron is UTC. Runs every hour at :03, then waits 10 minutes
  # between discovery, scoring, and resume customization.
  - cron: '0 */2 * * *'
  workflow_dispatch:


concurrency:
  group: hourly-job-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LINKEDIN_STORAGE_STATE_JSON: ${{ secrets.LINKEDIN_STORAGE_STATE_JSON }}
      APPLICATION_DEFAULT_ANSWERS_JSON: ${{ secrets.APPLICATION_DEFAULT_ANSWERS_JSON }}

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate LLM secrets
      run: |
        python - <<'PY'
        import os
        import sys

        checks = [
            ("GEMINI_API_KEY", "AIza", "Gemini"),
            ("OPENAI_API_KEY", "sk-", "OpenAI"),
            ("ANTHROPIC_API_KEY", "sk-ant-", "Anthropic"),
            ("GROQ_API_KEY", "gsk_", "Groq"),
        ]
        errors = []
        for name, prefix, provider in checks:
            value = (os.environ.get(name) or "").strip()
            if value and not value.startswith(prefix):
                errors.append(f"{name} is set but does not look like a {provider} key.")

        if errors:
            print("Invalid LLM secret configuration:")
            for error in errors:
                print(f"- {error}")
            print("Fix the repository secret value under Settings > Secrets and variables > Actions.")
            sys.exit(1)

        if not any(os.environ.get(name) for name, _, _ in checks):
            print("At least one LLM provider secret is required: GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, or GROQ_API_KEY.")
            sys.exit(1)

        print("LLM secret names and key formats look valid.")
        PY

    - name: Run job scraper
      run: python scraper.py

    - name: Wait before scoring
      run: sleep 60

    - name: Run job scorer
      run: python score_jobs.py

    - name: Wait before resume customization
      run: sleep 60

    - name: Run resume customization
      run: python custom_resume_generator.py

    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium

    - name: Run LinkedIn Easy Apply assistant
      run: python application_assistant.py --mode auto-apply --provider linkedin --limit 5 --min-score 80 --headless

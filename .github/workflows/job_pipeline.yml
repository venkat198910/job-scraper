name: Job Pipeline

on:
  schedule:
  # GitHub cron is UTC. Run every 2 hours, offset from :00 to reduce
  # scheduler delays during top-of-hour traffic.
  - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
        - source: linkedin
          chunk_index: 0
          chunk_total: 6
        - source: linkedin
          chunk_index: 1
          chunk_total: 6
        - source: linkedin
          chunk_index: 2
          chunk_total: 6
        - source: linkedin
          chunk_index: 3
          chunk_total: 6
        - source: linkedin
          chunk_index: 4
          chunk_total: 6
        - source: linkedin
          chunk_index: 5
          chunk_total: 6
        - source: careers_future
          chunk_index: 0
          chunk_total: 1
        - source: company_careers
          chunk_index: 0
          chunk_total: 4
        - source: company_careers
          chunk_index: 1
          chunk_total: 4
        - source: company_careers
          chunk_index: 2
          chunk_total: 4
        - source: company_careers
          chunk_index: 3
          chunk_total: 4
        - source: naukri
          chunk_index: 0
          chunk_total: 1
        - source: naukri_gulf
          chunk_index: 0
          chunk_total: 1
    name: Scrape ${{ matrix.source }} chunk ${{ matrix.chunk_index }}

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_ALERT_EMAIL_TO: ${{ secrets.JOB_ALERT_EMAIL_TO }}
      JOB_ALERT_EMAIL_FROM: ${{ secrets.JOB_ALERT_EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NAUKRI_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_STORAGE_STATE_JSON }}
      NAUKRI_GULF_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_GULF_STORAGE_STATE_JSON }}
      NAUKRI_STORAGE_STATE: naukri_storage_state.json
      NAUKRI_GULF_STORAGE_STATE: naukri_gulf_storage_state.json
      NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
      NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      NAUKRI_GULF_USERNAME: ${{ secrets.NAUKRI_GULF_USERNAME }}
      NAUKRI_GULF_PASSWORD: ${{ secrets.NAUKRI_GULF_PASSWORD }}
      NAUKRI_BROWSER_HEADLESS: "false"
      SCRAPING_SOURCE: ${{ matrix.source }}
      SCRAPING_CHUNK_INDEX: ${{ matrix.chunk_index }}
      SCRAPING_CHUNK_TOTAL: ${{ matrix.chunk_total }}

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ matrix.source }}" = "naukri" ] || [ "${{ matrix.source }}" = "naukri_gulf" ]; then
          python -m playwright install --with-deps chromium
        fi

    - name: Refresh Naukri session for this run
      if: matrix.source == 'naukri'
      run: |
        if [ -n "${NAUKRI_USERNAME:-}" ] && [ -n "${NAUKRI_PASSWORD:-}" ]; then
          xvfb-run -a python save_browser_session.py naukri --output "$NAUKRI_STORAGE_STATE" --auto-login --wait-seconds 1 || true
        else
          echo "Naukri credentials are missing; using existing NAUKRI_STORAGE_STATE_JSON if present."
        fi

    - name: Refresh Naukri Gulf session for this run
      if: matrix.source == 'naukri_gulf'
      run: |
        if [ -n "${NAUKRI_GULF_USERNAME:-}" ] && [ -n "${NAUKRI_GULF_PASSWORD:-}" ]; then
          xvfb-run -a python save_browser_session.py naukri_gulf --output "$NAUKRI_GULF_STORAGE_STATE" --auto-login --wait-seconds 1 || true
        else
          echo "Naukri Gulf credentials are missing; using existing NAUKRI_GULF_STORAGE_STATE_JSON if present."
        fi

    - name: Run job scraper
      run: |
        if { [ "${{ matrix.source }}" = "naukri" ] || [ "${{ matrix.source }}" = "naukri_gulf" ]; } && command -v xvfb-run >/dev/null 2>&1; then
          xvfb-run -a python scraper.py
        else
          python scraper.py
        fi

    - name: Upload scraper debug artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: scraper-debug-${{ matrix.source }}-${{ matrix.chunk_index }}
        path: /tmp/jobtrack_scraper_debug/
        if-no-files-found: ignore

  pipeline:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LINKEDIN_STORAGE_STATE_JSON: ${{ secrets.LINKEDIN_STORAGE_STATE_JSON }}
      APPLICATION_DEFAULT_ANSWERS_JSON: ${{ secrets.APPLICATION_DEFAULT_ANSWERS_JSON }}
      APPLICATION_PORTAL_EMAIL: ${{ secrets.APPLICATION_PORTAL_EMAIL }}
      APPLICATION_PORTAL_PASSWORD: ${{ secrets.APPLICATION_PORTAL_PASSWORD }}
      JOB_ALERT_EMAIL_TO: ${{ secrets.JOB_ALERT_EMAIL_TO }}
      JOB_ALERT_EMAIL_FROM: ${{ secrets.JOB_ALERT_EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NAUKRI_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_STORAGE_STATE_JSON }}
      NAUKRI_GULF_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_GULF_STORAGE_STATE_JSON }}
      NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
      NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
      NAUKRI_GULF_USERNAME: ${{ secrets.NAUKRI_GULF_USERNAME }}
      NAUKRI_GULF_PASSWORD: ${{ secrets.NAUKRI_GULF_PASSWORD }}
      NAUKRI_BROWSER_HEADLESS: "false"

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate LLM secrets
      run: |
        python - <<'PY'
        import os
        import sys

        checks = [
            ("GEMINI_API_KEY", "AIza", "Gemini"),
            ("OPENAI_API_KEY", "sk-", "OpenAI"),
            ("ANTHROPIC_API_KEY", "sk-ant-", "Anthropic"),
            ("GROQ_API_KEY", "gsk_", "Groq"),
        ]
        errors = []
        for name, prefix, provider in checks:
            value = (os.environ.get(name) or "").strip()
            if value and not value.startswith(prefix):
                errors.append(f"{name} is set but does not look like a {provider} key.")

        if errors:
            print("Invalid LLM secret configuration:")
            for error in errors:
                print(f"- {error}")
            print("Fix the repository secret value under Settings > Secrets and variables > Actions.")
            sys.exit(1)

        if not any(os.environ.get(name) for name, _, _ in checks):
            print("At least one LLM provider secret is required: GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, or GROQ_API_KEY.")
            sys.exit(1)

        print("LLM secret names and key formats look valid.")
        PY

    - name: Run job scorer
      run: python score_jobs.py

    - name: Wait before resume customization
      run: sleep 60

    - name: Run resume customization
      run: python custom_resume_generator.py

    - name: Wait before application attempts
      run: sleep 60

    - name: Validate LinkedIn session secret
      run: |
        python - <<'PY'
        import json
        import os
        import sys

        state = os.environ.get("LINKEDIN_STORAGE_STATE_JSON", "").strip()
        if not state:
            print("LINKEDIN_STORAGE_STATE_JSON secret is missing.")
            print("Create it from a local Playwright LinkedIn login session before running auto-apply.")
            sys.exit(1)

        try:
            parsed = json.loads(state)
        except json.JSONDecodeError as exc:
            print(f"LINKEDIN_STORAGE_STATE_JSON is not valid JSON: {exc}")
            sys.exit(1)

        if not parsed.get("cookies"):
            print("LINKEDIN_STORAGE_STATE_JSON has no cookies. Recreate the LinkedIn session.")
            sys.exit(1)

        print("LinkedIn session secret is present.")
        PY

    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium

    - name: Run LinkedIn Easy Apply assistant
      run: python application_assistant.py --mode auto-apply --provider linkedin --limit 30 --min-score 80 --max-job-age-minutes 720 --daily-submit-limit 30 --headless --allow-submit

    - name: Upload application debug artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: application-debug-artifacts
        path: /tmp/jobtrack_application_debug/
        if-no-files-found: ignore

    - name: Validate company portal credentials
      run: |
        python - <<'PY'
        import os
        import sys

        if not (os.environ.get("APPLICATION_PORTAL_PASSWORD") or "").strip():
            print("APPLICATION_PORTAL_PASSWORD secret is missing.")
            print("Create it under Settings > Secrets and variables > Actions before enabling company portal auto-register/apply.")
            sys.exit(1)

        print("Company portal password secret is present.")
        PY

    - name: Run Company Portal assistant
      run: python application_assistant.py --mode prepare-company-portal --provider all --limit 30 --min-score 80 --max-job-age-minutes 720 --daily-submit-limit 30 --headless --allow-login --allow-register --allow-submit

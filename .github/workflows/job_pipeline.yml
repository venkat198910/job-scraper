name: Job Pipeline

on:
  schedule:
  # GitHub cron is UTC. Runs hourly, then waits 10 minutes between
  # discovery, scoring, resume customization, and application attempts.
  - cron: '0 */2 * * *'
  workflow_dispatch:


concurrency:
  group: job-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LINKEDIN_STORAGE_STATE_JSON: ${{ secrets.LINKEDIN_STORAGE_STATE_JSON }}
      APPLICATION_DEFAULT_ANSWERS_JSON: ${{ secrets.APPLICATION_DEFAULT_ANSWERS_JSON }}
      APPLICATION_PORTAL_EMAIL: ${{ secrets.APPLICATION_PORTAL_EMAIL }}
      APPLICATION_PORTAL_PASSWORD: ${{ secrets.APPLICATION_PORTAL_PASSWORD }}

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate LLM secrets
      run: |
        python - <<'PY'
        import os
        import sys

        checks = [
            ("GEMINI_API_KEY", "AIza", "Gemini"),
            ("OPENAI_API_KEY", "sk-", "OpenAI"),
            ("ANTHROPIC_API_KEY", "sk-ant-", "Anthropic"),
            ("GROQ_API_KEY", "gsk_", "Groq"),
        ]
        errors = []
        for name, prefix, provider in checks:
            value = (os.environ.get(name) or "").strip()
            if value and not value.startswith(prefix):
                errors.append(f"{name} is set but does not look like a {provider} key.")

        if errors:
            print("Invalid LLM secret configuration:")
            for error in errors:
                print(f"- {error}")
            print("Fix the repository secret value under Settings > Secrets and variables > Actions.")
            sys.exit(1)

        if not any(os.environ.get(name) for name, _, _ in checks):
            print("At least one LLM provider secret is required: GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, or GROQ_API_KEY.")
            sys.exit(1)

        print("LLM secret names and key formats look valid.")
        PY

    # - name: Run job scraper
    #   run: python scraper.py

    # - name: Wait before scoring
    #   run: sleep 60

    # - name: Run job scorer
    #   run: python score_jobs.py

    # - name: Wait before resume customization
    #   run: sleep 60

    # - name: Run resume customization
    #   run: python custom_resume_generator.py

    # - name: Wait before application attempts
    #   run: sleep 60

    - name: Validate LinkedIn session secret
      run: |
        python - <<'PY'
        import json
        import os
        import sys

        state = os.environ.get("LINKEDIN_STORAGE_STATE_JSON", "").strip()
        if not state:
            print("LINKEDIN_STORAGE_STATE_JSON secret is missing.")
            print("Create it from a local Playwright LinkedIn login session before running auto-apply.")
            sys.exit(1)

        try:
            parsed = json.loads(state)
        except json.JSONDecodeError as exc:
            print(f"LINKEDIN_STORAGE_STATE_JSON is not valid JSON: {exc}")
            sys.exit(1)

        if not parsed.get("cookies"):
            print("LINKEDIN_STORAGE_STATE_JSON has no cookies. Recreate the LinkedIn session.")
            sys.exit(1)

        print("LinkedIn session secret is present.")
        PY

    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium

    - name: Run LinkedIn Easy Apply assistant
      run: python application_assistant.py --mode auto-apply --provider linkedin --limit 30 --min-score 80 --max-job-age-minutes 120 --daily-submit-limit 30 --headless --allow-submit

    - name: Validate company portal credentials
      run: |
        python - <<'PY'
        import os
        import sys

        if not (os.environ.get("APPLICATION_PORTAL_PASSWORD") or "").strip():
            print("APPLICATION_PORTAL_PASSWORD secret is missing.")
            print("Create it under Settings > Secrets and variables > Actions before enabling company portal auto-register/apply.")
            sys.exit(1)

        print("Company portal password secret is present.")
        PY

    - name: Run Company Portal assistant
      run: python application_assistant.py --mode prepare-company-portal --provider all --limit 30 --min-score 80 --max-job-age-minutes 120 --daily-submit-limit 30 --headless --allow-login --allow-register --allow-submit

name: Parse Resume Manually

on:
  workflow_dispatch:

jobs:
  parse_resume_job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found. Please create one with necessary packages."
            # Optionally, install known dependencies directly if requirements.txt is missing
            # pip install pdfplumber google-generativeai supabase
            exit 1
          fi

      - name: Validate LLM secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          checks = [
              ("GEMINI_API_KEY", "AIza", "Gemini"),
              ("OPENAI_API_KEY", "sk-", "OpenAI"),
              ("ANTHROPIC_API_KEY", "sk-ant-", "Anthropic"),
              ("GROQ_API_KEY", "gsk_", "Groq"),
          ]
          errors = []
          for name, prefix, provider in checks:
              value = os.environ.get(name)
              if value and not value.startswith(prefix):
                  errors.append(f"{name} is set but does not look like a {provider} key.")

          if errors:
              print("Invalid LLM secret configuration:")
              for error in errors:
                  print(f"- {error}")
              print("Fix the repository secret value under Settings > Secrets and variables > Actions.")
              sys.exit(1)

          if not any(os.environ.get(name) for name, _, _ in checks):
              print("At least one LLM provider secret is required: GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, or GROQ_API_KEY.")
              sys.exit(1)

          print("LLM secret names and key formats look valid.")
          PY

      - name: Run resume parser script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # LLM Configuration (set via Repository Secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python resume_parser.py

name: Regenerate Existing Custom Resumes

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Regenerate and replace every existing custom-resume PDF
        required: true
        type: boolean
        default: false
  push:
    branches:
      - enhancement
    paths:
      - ".github/backfill/regenerate-custom-resumes.txt"
      - ".github/workflows/regenerate_existing_resumes.yml"

permissions:
  contents: read

concurrency:
  group: regenerate-existing-custom-resumes
  cancel-in-progress: false

jobs:
  regenerate:
    if: ${{ github.event_name == 'push' || inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate all existing custom resumes
        run: python regenerate_custom_resume_pdfs.py

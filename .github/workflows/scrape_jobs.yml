# .github/workflows/scrape_jobs.yml
name: Job Scraper

on:
  workflow_dispatch:


concurrency:
  group: hourly-job-discovery
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - source: linkedin
            chunk_index: 0
            chunk_total: 6
          - source: linkedin
            chunk_index: 1
            chunk_total: 6
          - source: linkedin
            chunk_index: 2
            chunk_total: 6
          - source: linkedin
            chunk_index: 3
            chunk_total: 6
          - source: linkedin
            chunk_index: 4
            chunk_total: 6
          - source: linkedin
            chunk_index: 5
            chunk_total: 6
          - source: careers_future
            chunk_index: 0
            chunk_total: 1
          - source: company_careers
            chunk_index: 0
            chunk_total: 1
          - source: naukri
            chunk_index: 0
            chunk_total: 1
          - source: naukri_gulf
            chunk_index: 0
            chunk_total: 1
    name: Scrape ${{ matrix.source }} chunk ${{ matrix.chunk_index }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ matrix.source }}" = "naukri" ] || [ "${{ matrix.source }}" = "naukri_gulf" ]; then
            python -m playwright install --with-deps chromium
          fi

      - name: Run scraper script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAUKRI_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_STORAGE_STATE_JSON }}
          NAUKRI_GULF_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_GULF_STORAGE_STATE_JSON }}
          NAUKRI_BROWSER_HEADLESS: "false"
          SCRAPING_SOURCE: ${{ matrix.source }}
          SCRAPING_CHUNK_INDEX: ${{ matrix.chunk_index }}
          SCRAPING_CHUNK_TOTAL: ${{ matrix.chunk_total }}
        run: |
          if { [ "${{ matrix.source }}" = "naukri" ] || [ "${{ matrix.source }}" = "naukri_gulf" ]; } && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python scraper.py
          else
            python scraper.py
          fi

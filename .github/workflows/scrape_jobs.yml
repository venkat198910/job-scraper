# .github/workflows/scrape_jobs.yml
name: Job Scraper

on:
  workflow_dispatch:


concurrency:
  group: hourly-job-discovery
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source:
          - linkedin
          - careers_future
          - company_careers
          - naukri
          - naukri_gulf
    name: Scrape ${{ matrix.source }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ matrix.source }}" = "naukri" ] || [ "${{ matrix.source }}" = "naukri_gulf" ]; then
            python -m playwright install --with-deps chromium
          fi

      - name: Run scraper script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAUKRI_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_STORAGE_STATE_JSON }}
          NAUKRI_GULF_STORAGE_STATE_JSON: ${{ secrets.NAUKRI_GULF_STORAGE_STATE_JSON }}
          NAUKRI_BROWSER_HEADLESS: "false"
          SCRAPING_SOURCE: ${{ matrix.source }}
        run: |
          if { [ "${{ matrix.source }}" = "naukri" ] || [ "${{ matrix.source }}" = "naukri_gulf" ]; } && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python scraper.py
          else
            python scraper.py
          fi
